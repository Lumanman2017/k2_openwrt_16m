#=================================================
# 适配 Ubuntu24.04 + OpenWrt main(snapshot)
# 斐讯K2 A2 硬改16M Flash | shownb/k2_openwrt_16m
#=================================================
name: 16m 固件-K2A2-main-snapshot

on:
  repository_dispatch:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: main
  GH_PROXY: https://ghproxy.net/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 释放磁盘空间（必须，否则编译盘不够）
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: 安装编译依赖【Ubuntu24.04适配版】
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y \
            build-essential flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools python3-dev \
            rsync swig unzip zlib1g-dev file wget curl \
            device-tree-compiler libelf-dev autoconf automake libtool autopoint \
            p7zip p7zip-full texinfo qemu-utils upx
          sudo apt-get clean
          sudo ln -sf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime

      - name: 克隆 OpenWrt 源码（ghproxy加速）
        run: |
          git clone ${GH_PROXY}${REPO_URL} -b ${REPO_BRANCH} openwrt

      - name: 注入 K2 A2 16M 补丁 v22.4（shownb仓库）
        run: |
          cd openwrt
          # 下载独立16M设备树
          curl -L ${GH_PROXY}https://raw.githubusercontent.com/shownb/k2_openwrt_16m/main/dts/mt7620a_phicomm_k2-A2-v22.4-16m.dts \
            -o target/linux/ramips/dts/mt7620a_phicomm_k2-A2-v22.4-16m.dts
          # 追加设备定义片段，不删除原版mt7620.mk（重点！）
          curl -L ${GH_PROXY}https://raw.githubusercontent.com/shownb/k2_openwrt_16m/main/mk_add.txt \
            >> target/linux/ramips/image/mt7620.mk

      - name: feeds 初始化更新
        run: |
          cd openwrt
          ./scripts/feeds clean
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 加载配置文件
        run: |
          cd openwrt
          rm -f .config*
          cp ../simple.config .config
          make defconfig

      - name: 预下载源码包
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: 多线程编译
        run: |
          cd openwrt
          echo "编译线程: $(nproc)"
          make -j$(nproc) V=s

      - name: 失败自动切换单线程编译
        if: failure()
        run: |
          cd openwrt
          make -j1 V=s

      - name: 清理无用文件
        run: |
          cd openwrt
          find ./bin/targets/ -type d -name "packages" | xargs rm -rf {}
          find ./bin/targets/ -name "*rootfs*img*" | xargs rm -rf {}

      - name: 上传固件产物
        uses: actions/upload-artifact@v4
        with:
          name: "K2A2-16M-main-fw"
          path: ./openwrt/bin/targets/
