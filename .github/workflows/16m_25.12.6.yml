#=================================================
# 适配 Ubuntu24.04 + OpenWrt main(snapshot)
# 斐讯K2 A2 硬改16M Flash | shownb/k2_openwrt_16m
# 修复 TERM=unknown ncurses报错
#=================================================
name: 16m 固件-K2A2-main-snapshot

on:
  repository_dispatch:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  TERM: xterm
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: 安装编译依赖【Ubuntu24.04适配版】
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y \
            build-essential flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools python3-dev \
            rsync swig unzip zlib1g-dev file wget curl \
            device-tree-compiler libelf-dev autoconf automake libtool autopoint \
            p7zip p7zip-full texinfo qemu-utils upx
          sudo apt-get clean
          sudo ln -sf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime

      - name: 克隆 OpenWrt 源码（原生地址 + 重试机制）
        run: |
          for i in {1..3}; do
            git clone ${REPO_URL} -b ${REPO_BRANCH} openwrt && break
            echo "第$i次克隆失败，等待15s重试"
            sleep 15
          done
          if [ ! -d "openwrt" ];then
            echo "❌ OpenWrt源码克隆多次失败！"
            exit 1
          fi
          ls -ld openwrt

      - name: 注入 K2 A2 16M 补丁 v22.4（shownb仓库，带重试）
        run: |
          cd openwrt
          # 下载dts
          for i in {1..3}; do
            curl -L https://raw.githubusercontent.com/shownb/k2_openwrt_16m/main/dts/mt7620a_phicomm_k2-A2-v22.4-16m.dts \
              -o target/linux/ramips/dts/mt7620a_phicomm_k2-A2-v22.4-16m.dts && break
            echo "DTS下载失败，重试 $i"
            sleep 10
          done
          if [ ! -f target/linux/ramips/dts/mt7620a_phicomm_k2-A2-v22.4-16m.dts ];then
            echo "❌ DTS文件下载失败"
            exit 1
          fi
          # 追加mk片段
          for i in {1..3}; do
            curl -L https://raw.githubusercontent.com/shownb/k2_openwrt_16m/main/mk_add.txt >> target/linux/ramips/image/mt7620.mk && break
            echo "mk_add.txt下载失败，重试 $i"
            sleep 10
          done
          ls target/linux/ramips/dts | grep k2
          grep phicomm_k2_A2_v22.4_16m target/linux/ramips/image/mt7620.mk

      - name: feeds 初始化更新
        run: |
          cd openwrt
          ./scripts/feeds clean
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 加载配置文件（olddefconfig 替代 defconfig，解决终端报错）
        run: |
          cd openwrt
          rm -f .config*
          cp ../simple.config .config
          make olddefconfig

      - name: 预下载源码包
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: 多线程编译
        run: |
          cd openwrt
          echo "编译线程: $(nproc)"
          make -j$(nproc) V=s

      - name: 失败自动切换单线程编译
        if: failure()
        run: |
          cd openwrt
          make -j1 V=s

      - name: 清理无用文件
        run: |
          cd openwrt
          find ./bin/targets/ -type d -name "packages" | xargs rm -rf {}
          find ./bin/targets/ -name "*rootfs*img*" | xargs rm -rf {}

      - name: 上传固件产物
        uses: actions/upload-artifact@v4
        with:
          name: "K2A2-16M-main-fw"
          path: ./openwrt/bin/targets/
