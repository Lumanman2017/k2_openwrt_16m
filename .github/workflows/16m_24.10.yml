name: K2 16M OpenWrt 24.10 Stable
on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  TERM: xterm
  OPENWRT_BRANCH: openwrt-24.10

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    permissions:
      contents: write
      
    steps:
      - name: 拉取K2补丁仓库
        uses: actions/checkout@v7
        with:
          repository: lumanman2017/k2_openwrt_16m
          path: k2src

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y \
            build-essential flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools python3-dev \
            rsync swig unzip zlib1g-dev file wget curl \
            device-tree-compiler libelf-dev autoconf automake libtool autopoint \
            p7zip p7zip-full texinfo qemu-utils upx

      - name: 拉取 OpenWrt 24.10 源码 + 注入K2补丁
        run: |
          git clone https://github.com/openwrt/openwrt.git -b $OPENWRT_BRANCH openwrt
          cd openwrt
          # 复制补丁dtsi
          cp ../k2src/target/linux/ramips/dts/mt7620a_phicomm_k2-v22.4.dts target/linux/ramips/dts/
          # 写入修改后的mt7620.mk
          awk '/define Device\/phicomm_psg1218/,/endef/{next} 1' ../k2src/target/linux/ramips/image/mt7620.mk > /tmp/k2_filtered.mk
          if ! grep -q "phicomm_psg1218" target/linux/ramips/image/mt7620.mk; then
            cat /tmp/k2_filtered.mk >> target/linux/ramips/image/mt7620.mk
          fi

      - name: Feeds 更新 & 安装
        run: |
          cd openwrt
          ./scripts/feeds clean
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 加载K2 16M配置
        run: |
          cd openwrt
          cp ../k2src/k2_16m.config .config
          make defconfig
          # 增加调试打印，确认选中设备
          grep CONFIG_TARGET_DEVICE .config

      - name: 预下载源码包（加速编译）
        run: |
          cd openwrt
          make download -j8

      - name: 多线程编译
        run: |
          cd openwrt
          make -j$(nproc) V=s

      - name: 编译失败自动切换单线程
        if: failure()
        run: |
          cd openwrt
          make -j1 V=s

      - name: 上传固件
        uses: actions/upload-artifact@v7
        with:
          name: K2-16M-OpenWrt-24.10
          path: openwrt/bin/targets/
