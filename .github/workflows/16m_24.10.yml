name: K2 16M OpenWrt 24.10 Stable
on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  TERM: xterm
  OPENWRT_BRANCH: openwrt-24.10

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取 shownb K2补丁仓库
        uses: actions/checkout@v4
        with:
          repository: shownb/k2_openwrt_16m
          path: k2src

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y \
            build-essential flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools python3-dev \
            rsync swig unzip zlib1g-dev file wget curl \
            device-tree-compiler libelf-dev autoconf automake libtool autopoint \
            p7zip p7zip-full texinfo qemu-utils upx

      - name: 拉取 OpenWrt 24.10 源码 + 手动注入K2补丁
        run: |
          git clone https://github.com/openwrt/openwrt.git -b $OPENWRT_BRANCH openwrt
          cd openwrt
          # 拷贝dtsi文件
          cp ../k2src/mt7620a_phicomm_psg1218.dtsi target/linux/ramips/dts/
          # 追加设备定义到mt7620.mk
          cat ../k2src/mt7620.mk >> target/linux/ramips/image/mt7620.mk

      - name: Feeds 更新 & 安装
        run: |
          cd openwrt
          ./scripts/feeds clean
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 加载K2 16M配置文件
        run: |
          cd openwrt
          cp ../k2src/k2_16m.config .config
          make olddefconfig

      - name: 预下载源码包（加速编译）
        run: |
          cd openwrt
          make download -j8

      - name: 多线程编译
        run: |
          cd openwrt
          make -j$(nproc) V=s

      - name: 编译失败自动切换单线程
        if: failure()
        run: |
          cd openwrt
          make -j1 V=s

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: K2-16M-OpenWrt-24.10
          path: openwrt/bin/targets/
